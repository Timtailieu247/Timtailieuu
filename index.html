<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tìm tài liệu— Thư viện tài liệu sưu tầm miễn phí</title>

<!-- Open Graph tags (giúp Facebook/Threads hiển thị preview, tránh bị flag thiếu metadata) -->
<meta property="og:title" content="Tìm tài liệu — Thư viện tài liệu sưu tầm miễn phí" />
<meta property="og:description" content="Kho template miễn phí đa ngành nghề: menu, nhân sự, tài chính, vận hành, học ngôn ngữ." />
<meta property="og:image" content="https://timtailieu.site/preview.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://timtailieu.site/" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="vi_VN" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Tìm tài liệu — Thư viện tài liệu sưu tầm miễn phí" />
<meta name="twitter:description" content="Kho template miễn phí đa ngành nghề: menu, nhân sự, tài chính, vận hành, học ngôn ngữ." />
<meta name="twitter:image" content="https://timtailieu.site/preview.jpg" />

<style>
:root {
--bg: #f9f8f5;
--white: #ffffff;
--text: #1a1a1a;
--muted: #666;
--border: #e0ddd6;
--green: #1D9E75;
--green-dark: #0F6E56;
--green-light: #E1F5EE;
--orange: #FA8922;
--radius: 12px;
--radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
background: var(--bg);
color: var(--text);
min-height: 100vh;
}

/* ── HERO / SEARCH ── */
.hero {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 80px 20px 40px;
text-align: center;
transition: padding 0.4s;
}
.hero.compact { padding: 32px 20px 24px; }

.logo {
font-size: 15px;
font-weight: 600;
letter-spacing: 0.04em;
color: var(--green-dark);
margin-bottom: 28px;
text-transform: uppercase;
}
.hero.compact .logo { font-size: 13px; margin-bottom: 16px; }

.tagline {
font-size: 28px;
font-weight: 300;
color: var(--text);
margin-bottom: 8px;
letter-spacing: -0.02em;
}
.hero.compact .tagline { display: none; }

.sub {
font-size: 14px;
color: var(--muted);
margin-bottom: 32px;
}
.hero.compact .sub { display: none; }

.search-wrap {
width: 100%;
max-width: 560px;
position: relative;
}
.search-input {
width: 100%;
padding: 16px 52px 16px 20px;
font-size: 16px;
border: 1.5px solid var(--border);
border-radius: 100px;
background: var(--white);
color: var(--text);
outline: none;
transition: border-color 0.2s, box-shadow 0.2s;
-webkit-appearance: none;
}
.search-input:focus {
border-color: var(--green);
box-shadow: 0 0 0 3px rgba(29,158,117,0.12);
}
.search-icon {
position: absolute;
right: 18px;
top: 50%;
transform: translateY(-50%);
color: var(--muted);
pointer-events: none;
}
.search-icon svg { width: 20px; height: 20px; }

.hint {
margin-top: 12px;
font-size: 12px;
color: var(--muted);
}
.hint span {
display: inline-block;
background: var(--white);
border: 1px solid var(--border);
border-radius: 20px;
padding: 3px 10px;
margin: 3px 4px;
cursor: pointer;
transition: border-color 0.15s;
}
.hint span:hover { border-color: var(--green); color: var(--green); }

/* ── CATEGORY DROPDOWN ── */
.cat-wrap { position: relative; width: 100%; max-width: 560px; margin-top: 10px; }
.cat-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 10px 18px; font-size: 13px; border: 1.5px solid var(--border); border-radius: 100px; background: var(--white); color: var(--muted); cursor: pointer; transition: border-color 0.2s; user-select: none; }
.cat-btn:hover, .cat-btn.open { border-color: var(--green); color: var(--text); }
.cat-btn .arrow { transition: transform 0.2s; font-size: 10px; }
.cat-btn.open .arrow { transform: rotate(180deg); }
.cat-dropdown { display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.08); z-index: 50; }
.cat-dropdown.show { display: block; }
.cat-item { display: flex; align-items: center; gap: 10px; padding: 11px 18px; font-size: 13px; color: var(--text); cursor: pointer; transition: background 0.12s; border-bottom: 0.5px solid var(--border); }
.cat-item:last-child { border-bottom: none; }
.cat-item:hover { background: var(--green-light); }
.cat-item .cat-icon { font-size: 16px; width: 24px; text-align: center; }
.cat-item .cat-count { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--border); padding: 1px 7px; border-radius: 20px; }
.cat-selected { color: var(--green-dark) !important; font-weight: 500; }

/* ── RESULTS ── */
.results {
max-width: 600px;
margin: 0 auto;
padding: 0 20px 60px;
}
.results-label {
font-size: 12px;
color: var(--muted);
margin-bottom: 12px;
padding-left: 4px;
}
.result-item {
background: var(--white);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 16px 18px;
margin-bottom: 10px;
display: flex;
align-items: center;
gap: 14px;
cursor: pointer;
transition: border-color 0.15s, transform 0.1s;
}
.result-item:hover {
border-color: var(--green);
transform: translateY(-1px);
}
.item-icon {
width: 42px;
height: 42px;
border-radius: var(--radius-sm);
background: var(--green-light);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
font-size: 18px;
}
.item-icon.pdf { background: #FAECE7; }
.item-icon.word { background: #E6F1FB; }
.item-info { flex: 1; }
.item-name { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
.item-meta { font-size: 12px; color: var(--muted); }
.item-cat {
font-size: 11px;
background: var(--green-light);
color: var(--green-dark);
padding: 2px 8px;
border-radius: 20px;
white-space: nowrap;
}
.btn-dl {
padding: 8px 16px;
background: var(--green);
color: #fff;
border: none;
border-radius: 100px;
font-size: 12px;
font-weight: 500;
cursor: pointer;
white-space: nowrap;
transition: background 0.15s;
}
.btn-dl:hover { background: var(--green-dark); }

.empty {
text-align: center;
padding: 48px 20px;
color: var(--muted);
font-size: 14px;
}
.empty strong { display: block; font-size: 32px; margin-bottom: 8px; }

/* ── TOAST ── */
.toast {
position: fixed;
bottom: 24px;
left: 50%;
transform: translateX(-50%) translateY(60px);
background: #1a1a1a;
color: #fff;
padding: 10px 22px;
border-radius: 100px;
font-size: 13px;
z-index: 9999;
transition: transform 0.3s ease, opacity 0.3s;
opacity: 0;
pointer-events: none;
}
.toast.show {
transform: translateX(-50%) translateY(0);
opacity: 1;
}
</style>
</head>
<body>

<div class="hero" id="hero">
<div class="logo">Kho Template</div>
<h1 class="tagline">Tìm tài liệu bạn cần</h1>
<p class="sub">Kho template miễn phí đa ngành nghề — menu, nhân sự, tài chính, vận hành, học ngôn ngữ</p>

<div class="search-wrap">
<input
class="search-input"
id="searchInput"
type="text"
placeholder="Nhập tên template... vd: Mẫu báo cáo, doanh thu, học tiếng anh, template content"
autocomplete="off"
/>
<span class="search-icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
</svg>
</span>
</div>

<div class="hint">
Thử tìm:
<span onclick="quickSearch('Ielts')">Ielts</span>
<span onclick="quickSearch('Ebook')">Ebook</span>
<span onclick="quickSearch('Tiếng Trung')">Tiếng Trung</span>
<span onclick="quickSearch('Marketing')">Marketing</span>
<span onclick="quickSearch('Edit video')">Edit video</span>
<span onclick="quickSearch('Học MOS')">Học MOS</span>
</div>

<div class="cat-wrap" id="catWrap">
<button class="cat-btn" id="catBtn" onclick="toggleCat()">
<span id="catLabel">📂 Duyệt theo danh mục</span>
<span class="arrow">▼</span>
</button>
<div class="cat-dropdown" id="catDropdown"></div>
</div>
</div>

<div class="results" id="results"></div>

<div class="toast" id="toast">⬇ Đang mở file tải xuống...</div>

<script>
const AFFILIATE_URL = 'https://s.shopee.vn/20wXuskbYB';

let templates = [];
let currentItem = null;

// ── CLICK ĐẦU TIÊN → MỞ SHOPEE (1 lần / phiên) ──
let affTriggered = false;
try { affTriggered = sessionStorage.getItem('aff_done') === '1'; } catch (e) {}

document.addEventListener('click', function (e) {
  if (affTriggered) return;
  affTriggered = true;
  try { sessionStorage.setItem('aff_done', '1'); } catch (e) {}

  e.preventDefault();
  e.stopPropagation();           // click đầu tiên chỉ dùng để mở Shopee
  window.open(AFFILIATE_URL, '_blank', 'noopener');
}, true);                        // capture phase: chạy trước mọi onclick khác

const fileIcons = { Excel: '📊', PDF: '📄', Word: '📝' };
const fileBg    = { Excel: '', PDF: 'pdf', Word: 'word' };

async function loadTemplates() {
try {
const res = await fetch('./templates.json?' + Date.now());
templates = await res.json();
} catch(e) {
templates = [];
}
return templates;
}

function normalize(str) {
return str.toLowerCase()
.replace(/đ/g, 'd')
.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function search(query) {
if (!query.trim()) return [];
const words = normalize(query).split(/\s+/).filter(Boolean);
return templates.filter(t => {
const haystack = normalize(
t.name + ' ' + (t.keywords||[]).join(' ') + ' ' + t.category
);
return words.every(w => haystack.includes(w));
});
}

function renderResults(items, query) {
const el = document.getElementById('results');
document.getElementById('hero').classList.add('compact');

if (!query.trim()) {
el.innerHTML = '';
document.getElementById('hero').classList.remove('compact');
return;
}

if (!items.length) {
el.innerHTML = `<div class="empty"><strong>🔍</strong>Không tìm thấy "<b>${query}</b>"<br>Thử từ khác như: menu, nhân viên, doanh thu...</div>`;
return;
}

el.innerHTML = `<div class="results-label">${items.length} kết quả cho "<b>${query}</b>"</div>` +
items.map(t => `
     <div class="result-item" onclick="openPopup(${t.id})">
       <div class="item-icon ${fileBg[t.type]||''}">${fileIcons[t.type]||'📁'}</div>
       <div class="item-info">
         <div class="item-name">${t.name}</div>
         <div class="item-meta">${t.type} · ${t.size}</div>
       </div>
       <span class="item-cat">${t.category}</span>
       <button class="btn-dl" onclick="event.stopPropagation();openPopup(${t.id})">Tải về</button>
     </div>
   `).join('');
}

// Bấm tải → mở thẳng link gốc (không còn popup Shopee)
function openPopup(id) {
const item = templates.find(t => t.id === id);
if (!item) return;
window.open(item.drive_url, '_blank');
showToast();
}

function showToast() {
const t = document.getElementById('toast');
t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 2800);
}

function quickSearch(kw) {
const input = document.getElementById('searchInput');
input.value = kw;
input.dispatchEvent(new Event('input'));
input.focus();
}

let debounce;
document.getElementById('searchInput').addEventListener('input', e => {
clearTimeout(debounce);
debounce = setTimeout(() => {
renderResults(search(e.target.value), e.target.value);
}, 200);
});

// ── CATEGORY DROPDOWN ──
const CATEGORIES = [
  { name: 'Tất cả', icon: '🗂️' },
  { name: 'Menu & Giá', icon: '☕' },
  { name: 'Vận hành', icon: '📋' },
  { name: 'Template marketing', icon: '📚' },
  { name: 'Edit video', icon: '🎬' },
  { name: 'Nhân sự', icon: '👥' },
  { name: 'Học tiếng trung', icon: '🇨🇳' },
  { name: 'Học tiếng anh', icon: '📣' },
  { name: 'Học tiếng Hàn', icon: '🇰🇷' },
  { name: 'Học tiếng Nhật', icon: '🇯🇵' },
  { name: 'Học tiếng Nga', icon: '🇷🇺' },
  { name: 'Học tiếng Pháp', icon: '🇫🇷' },
  { name: 'Tiếng Đức', icon: '🇩🇪' },
  { name: 'AI', icon: '🤖' },
  { name: 'Biểu mẫu', icon: '📝' },
  { name: 'Plan du lịch', icon: '✈️' },
  { name: 'Kinh doanh', icon: '💼' },
  { name: 'Tiktok', icon: '📷' },
  { name: 'Mẹ và bé', icon: '🍼' },
  { name: 'Học MOS', icon: '📊' },
  { name: 'Học Facebook Ads', icon: '📢' },
  { name: 'Tài liệu Affiliate', icon: '💰' },
  { name: 'Kỹ năng phát triển bàn thân', icon: '🌱' },
  { name: 'Toán Học', icon: '🧮' },
  { name: 'Văn học', icon: '📖' },
  { name: 'CNTT', icon: '💻' },
  { name: 'Tài liệu sinh viên', icon: '🎓' },
  { name: 'ebook', icon: '📕' },
  { name: 'Khác', icon: '📁' },
];

function buildCatMenu() {
const dd = document.getElementById('catDropdown');
dd.innerHTML = CATEGORIES.map(c => {
const count = c.name === 'Tất cả'
? templates.length
: templates.filter(t => t.category === c.name).length;
if (c.name !== 'Tất cả' && count === 0) return '';
return `<div class="cat-item" onclick="selectCat('${c.name}','${c.icon}')">
     <span class="cat-icon">${c.icon}</span>
     <span>${c.name}</span>
     <span class="cat-count">${count}</span>
   </div>`;
}).join('');
}

function toggleCat() {
document.getElementById('catDropdown').classList.toggle('show');
document.getElementById('catBtn').classList.toggle('open');
}

function selectCat(name, icon) {
document.getElementById('catDropdown').classList.remove('show');
document.getElementById('catBtn').classList.remove('open');
const label = document.getElementById('catLabel');
if (name === 'Tất cả') {
label.textContent = '📂 Duyệt theo danh mục';
label.className = '';
document.getElementById('searchInput').value = '';
document.getElementById('results').innerHTML = '';
document.getElementById('hero').classList.remove('compact');
return;
}
label.textContent = icon + ' ' + name;
label.className = 'cat-selected';
document.getElementById('searchInput').value = '';
renderResults(templates.filter(t => t.category === name), name);
}

document.addEventListener('click', e => {
const wrap = document.getElementById('catWrap');
if (wrap && !wrap.contains(e.target)) {
document.getElementById('catDropdown').classList.remove('show');
document.getElementById('catBtn').classList.remove('open');
}
});

loadTemplates().then(() => {
buildCatMenu();
// Auto-search từ URL param ?q=...
const params = new URLSearchParams(window.location.search);
const q = params.get('q');
if (q) {
const input = document.getElementById('searchInput');
input.value = q;
renderResults(search(q), q);
}
});
</script>
</body>
</html>
